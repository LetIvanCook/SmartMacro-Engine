$kind: http-request
name: Update User
method: PUT
url: '{{baseUrl}}/api/users/{{userId}}'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Jane Doe",
      "dateOfBirth": "1995-06-15",
      "biologicalSex": "female",
      "activityLevel": "active",
      "goalType": "weight_loss"
    }
