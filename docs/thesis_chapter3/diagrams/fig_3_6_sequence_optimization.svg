<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1250" viewBox="0 0 1750 1250">
  <title>Hình 3-6: Sơ đồ tuần tự Tối ưu hóa thực đơn với Google OR-Tools — SmartMacro Engine</title>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" />
    </marker>
    <marker id="open-arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" />
    </marker>
    <!-- Realization hollow triangle -->
    <marker id="triangle-hollow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <polygon points="1 1, 13 7, 1 13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" />
    </marker>
    <!-- Filter for subtle drop-shadow -->
    <filter id="card-shadow" x="-3%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="callout-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1750" height="1250" fill="#F8FAFC" />
  <text x="875.0" y="38" font-family="Times New Roman, Arial" font-size="21" font-weight="bold" text-anchor="middle" fill="#0F172A">SƠ ĐỒ TUẦN TỰ: GIẢI BÀI TOÁN TỐI ƯU HÓA KHẨU PHẦN ĂN VỚI GOOGLE OR-TOOLS</text>
  <text x="875.0" y="62" font-family="Times New Roman, Arial" font-size="13" font-style="italic" text-anchor="middle" fill="#475569">Mô hình tuần tự chi tiết luồng xử lý từ Client → OptimizationsController → OptimizationService → OR-Tools GLOP Solver</text>

        <g id="lifeline-User">
          <rect x="35" y="95" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" filter="url(#card-shadow)" />
          <text x="110" y="115" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1E293B">Người dùng</text>
          <text x="110" y="131" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(User)</text>
          <line x1="110" y1="145" x2="110" y2="1180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-WebClient">
          <rect x="215" y="95" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#card-shadow)" />
          <text x="290" y="115" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2563EB">Web Browser</text>
          <text x="290" y="131" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(SPA React)</text>
          <line x1="290" y1="145" x2="290" y2="1180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-OptController">
          <rect x="445" y="95" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="2" filter="url(#card-shadow)" />
          <text x="520" y="115" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#047857">OptimizationsController</text>
          <text x="520" y="131" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(API Controller)</text>
          <line x1="520" y1="145" x2="520" y2="1180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-OptService">
          <rect x="695" y="95" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="2" filter="url(#card-shadow)" />
          <text x="770" y="115" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#047857">OptimizationService</text>
          <text x="770" y="131" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(Business Service)</text>
          <line x1="770" y1="145" x2="770" y2="1180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-DbContext">
          <rect x="965" y="95" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#6B21A8" stroke-width="2" filter="url(#card-shadow)" />
          <text x="1040" y="115" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#6B21A8">SmartMacroDbContext</text>
          <text x="1040" y="131" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(SQL Server)</text>
          <line x1="1040" y1="145" x2="1040" y2="1180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-Engine">
          <rect x="1255" y="95" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#card-shadow)" />
          <text x="1330" y="115" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#059669">MacroOptimizationEngine</text>
          <text x="1330" y="131" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(Core LP Engine)</text>
          <line x1="1330" y1="145" x2="1330" y2="1180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-GLOPSolver">
          <rect x="1535" y="95" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#card-shadow)" />
          <text x="1610" y="115" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0F766E">Google.OrTools</text>
          <text x="1610" y="131" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(GLOP Linear Solver)</text>
          <line x1="1610" y1="145" x2="1610" y2="1180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        
<rect x="103" y="170" width="14" height="950" rx="2" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.5" />
<rect x="283" y="185" width="14" height="920" rx="2" fill="#E2E8F0" stroke="#2563EB" stroke-width="1.5" />
<rect x="513" y="205" width="14" height="875" rx="2" fill="#E2E8F0" stroke="#047857" stroke-width="1.5" />
<rect x="763" y="230" width="14" height="835" rx="2" fill="#E2E8F0" stroke="#047857" stroke-width="1.5" />
<rect x="1033" y="260" width="14" height="50" rx="2" fill="#E2E8F0" stroke="#6B21A8" stroke-width="1.5" />
<rect x="1033" y="360" width="14" height="50" rx="2" fill="#E2E8F0" stroke="#6B21A8" stroke-width="1.5" />
<rect x="1323" y="480" width="14" height="480" rx="2" fill="#E2E8F0" stroke="#059669" stroke-width="1.5" />
<rect x="1603" y="520" width="14" height="370" rx="2" fill="#E2E8F0" stroke="#0F766E" stroke-width="1.5" />

        <g>
          <line x1="110" y1="185" x2="290" y2="185" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="200.0" y="179" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">1: Chọn mục tiêu &amp; thực phẩm kho, bấm &#x27;Tối ưu hóa khẩu phần&#x27;</text>
        </g>
        

        <g>
          <line x1="290" y1="205" x2="520" y2="205" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="405.0" y="199" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">2: POST /api/optimizations/generate-plan (DailyTargetId, IncludeFoodIds)</text>
        </g>
        

    <g>
      <path d="M 527 215 L 590 215 L 590 235 L 527 235" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="598" y="230" font-family="Consolas, monospace" font-size="11" fill="#047857">3: userId = User.FindFirstValue(Sub)</text>
    </g>
    

        <g>
          <line x1="520" y1="245" x2="770" y2="245" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="645.0" y="239" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">4: GenerateMealPlanAsync(userId, request)</text>
        </g>
        

        <g>
          <line x1="770" y1="265" x2="1040" y2="265" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="905.0" y="259" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">5: DailyTargets.Where(u =&gt; u.UserId == userId &amp;amp;&amp;amp; TargetDate == today)</text>
        </g>
        

        <g>
          <line x1="1040" y1="305" x2="770" y2="305" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="905.0" y="299" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">6: return DailyTargetDto (Kcal: 2200, P: 150g, C: 220g, F: 55g)</text>
        </g>
        

        <g>
          <line x1="770" y1="360" x2="1040" y2="360" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="905.0" y="354" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">7: UserFoodInventories.Where(QuantityGrams &gt; 0).ProjectTo&lt;InventoryItemDto&gt;()</text>
        </g>
        

        <g>
          <line x1="1040" y1="405" x2="770" y2="405" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="905.0" y="399" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">8: return List&lt;InventoryItemResponseDto&gt; (Danh sách nguyên liệu tồn kho)</text>
        </g>
        

    <g id="note-guard" transform="translate(680, 420)">
      <rect width="250" height="34" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2" />
      <text x="125" y="16" font-family="Times New Roman, Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400E">Kiểm tra điều kiện biên (Guards):</text>
      <text x="125" y="28" font-family="Times New Roman, Arial" font-size="10.5" text-anchor="middle" fill="#78350F">Target != null &amp;&amp; Inventory.Count &gt; 0</text>
    </g>
    

        <g>
          <line x1="770" y1="485" x2="1330" y2="485" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1050.0" y="479" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">9: CalculateOptimalMeal(targetDto, availableInventory)</text>
        </g>
        

        <g>
          <line x1="1330" y1="520" x2="1610" y2="520" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1470.0" y="514" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">10: Solver.CreateSolver(&#x27;GLOP&#x27;)</text>
        </g>
        

        <g>
          <line x1="1610" y1="550" x2="1330" y2="550" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1470.0" y="544" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">11: return Solver instance</text>
        </g>
        

        <g>
          <line x1="1330" y1="580" x2="1610" y2="580" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1470.0" y="574" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">12: MakeNumVar(0.0, QuantityGrams[i], &#x27;grams_i&#x27;) cho n thực phẩm</text>
        </g>
        

        <g>
          <line x1="1330" y1="620" x2="1610" y2="620" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1470.0" y="614" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">13: AddMacroConstraint(Protein, Carbs, Fat) với Tolerance ±5%</text>
        </g>
        

        <g>
          <line x1="1330" y1="660" x2="1610" y2="660" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1470.0" y="654" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">14: MakeNumVar(0, +Inf, &#x27;deviation&#x27;) &amp;amp; Tuyến tính hóa sai lệch Kcal</text>
        </g>
        

        <g>
          <line x1="1330" y1="700" x2="1610" y2="700" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1470.0" y="694" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">15: Objective.SetMinimization() sai lệch Kcal</text>
        </g>
        

        <g>
          <line x1="1330" y1="745" x2="1610" y2="745" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1470.0" y="739" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">16: Solve() [Thực thi thuật toán Simplex / Interior Point]</text>
        </g>
        

        <g>
          <line x1="1610" y1="790" x2="1330" y2="790" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1470.0" y="784" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#059669">17: return Solver.ResultStatus.OPTIMAL</text>
        </g>
        

    <g>
      <path d="M 1337 810 L 1420 810 L 1420 840 L 1337 840" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="1430" y="825" font-family="Consolas, monospace" font-size="10.5" fill="#059669">18: Lọc grams[i] &gt;= 0.5g,</text>
      <text x="1430" y="838" font-family="Consolas, monospace" font-size="10.5" fill="#059669">    tính Total Kcal/P/C/F</text>
    </g>
    

        <g>
          <line x1="1330" y1="870" x2="770" y2="870" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1050.0" y="864" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">19: return OptimizationResult(IsSuccessful=true, TotalMacros, Items)</text>
        </g>
        

    <g>
      <path d="M 777 890 L 860 890 L 860 920 L 777 920" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="870" y="905" font-family="Consolas, monospace" font-size="10.5" fill="#047857">20: Map DTO: SolverStatus='OPTIMAL',</text>
      <text x="870" y="918" font-family="Consolas, monospace" font-size="10.5" fill="#047857">    Target vs Achieved Macro, Items</text>
    </g>
    

        <g>
          <line x1="770" y1="950" x2="520" y2="950" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="645.0" y="944" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">21: return OptimizationResultDto</text>
        </g>
        

        <g>
          <line x1="520" y1="985" x2="290" y2="985" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="405.0" y="979" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#059669">22: HTTP 200 OK (OptimizationResultDto JSON)</text>
        </g>
        

        <g>
          <line x1="290" y1="1025" x2="110" y2="1025" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="200.0" y="1019" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">23: Render bảng định lượng gam thực phẩm &amp; Biểu đồ tiến độ Macro</text>
        </g>
        

    <g id="alt-infeasible" transform="translate(110, 1075)">
      <rect width="1580" height="75" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,4" />
      <text x="20" y="24" font-family="Times New Roman, Arial" font-size="12" font-weight="bold" fill="#991B1B">NHÁNH RẼ THẤT BẠI (INFEASIBLE BRANCH):</text>
      <text x="20" y="44" font-family="Times New Roman, Arial" font-size="11.5" fill="#7F1D1D">Nếu kho thực phẩm không đủ nguyên liệu đáp ứng đồng thời cả 3 ràng buộc Protein, Carbs, Fat trong ngưỡng ±5%:</text>
      <text x="20" y="62" font-family="Consolas, monospace" font-size="11" fill="#991B1B">→ SolverStatus = 'INFEASIBLE' | Message = 'Kho thực phẩm hiện tại không đủ để đáp ứng mục tiêu' | HTTP 200 kèm khuyến nghị bổ sung nguyên liệu.</text>
    </g>
    
</svg>