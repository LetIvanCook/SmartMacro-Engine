<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1180" viewBox="0 0 1650 1180">
  <title>Hình 3-5: Sơ đồ tuần tự Đăng nhập &amp; Quản lý kho thực phẩm — SmartMacro Engine</title>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" />
    </marker>
    <marker id="open-arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" />
    </marker>
    <!-- Realization hollow triangle -->
    <marker id="triangle-hollow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <polygon points="1 1, 13 7, 1 13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" />
    </marker>
    <!-- Filter for subtle drop-shadow -->
    <filter id="card-shadow" x="-3%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="callout-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="1650" height="1180" fill="#F8FAFC" />
  <text x="825.0" y="38" font-family="Times New Roman, Arial" font-size="21" font-weight="bold" text-anchor="middle" fill="#0F172A">SƠ ĐỒ TUẦN TỰ: ĐĂNG NHẬP, CẤP JWT TOKEN &amp; QUẢN LÝ KHO THỰC PHẨM CÁ NHÂN</text>
  <text x="825.0" y="62" font-family="Times New Roman, Arial" font-size="13" font-style="italic" text-anchor="middle" fill="#475569">Mô hình tuần tự tương tác từ Client SPA → Auth/Inventory Controllers → Services → SQL Server DbContext</text>

        <g id="lifeline-User">
          <rect x="50" y="100" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" filter="url(#card-shadow)" />
          <text x="120" y="120" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1E293B">Người dùng</text>
          <text x="120" y="136" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(User)</text>
          <line x1="120" y1="150" x2="120" y2="1110" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-WebClient">
          <rect x="250" y="100" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#card-shadow)" />
          <text x="320" y="120" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2563EB">Web Browser</text>
          <text x="320" y="136" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(SPA Client)</text>
          <line x1="320" y1="150" x2="320" y2="1110" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-AuthController">
          <rect x="470" y="100" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="2" filter="url(#card-shadow)" />
          <text x="540" y="120" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#B45309">AuthController</text>
          <text x="540" y="136" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(API Controller)</text>
          <line x1="540" y1="150" x2="540" y2="1110" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-AuthService">
          <rect x="690" y="100" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="2" filter="url(#card-shadow)" />
          <text x="760" y="120" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#047857">AuthService</text>
          <text x="760" y="136" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(Business Service)</text>
          <line x1="760" y1="150" x2="760" y2="1110" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-InventoryController">
          <rect x="940" y="100" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="2" filter="url(#card-shadow)" />
          <text x="1010" y="120" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#B45309">InventoryController</text>
          <text x="1010" y="136" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(API Controller)</text>
          <line x1="1010" y1="150" x2="1010" y2="1110" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-InventoryService">
          <rect x="1190" y="100" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="2" filter="url(#card-shadow)" />
          <text x="1260" y="120" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#047857">InventoryService</text>
          <text x="1260" y="136" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(Business Service)</text>
          <line x1="1260" y1="150" x2="1260" y2="1110" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

        <g id="lifeline-DbContext">
          <rect x="1440" y="100" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#6B21A8" stroke-width="2" filter="url(#card-shadow)" />
          <text x="1510" y="120" font-family="Times New Roman, Arial" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#6B21A8">SmartMacroDbContext</text>
          <text x="1510" y="136" font-family="Times New Roman, Arial" font-size="11" text-anchor="middle" fill="#64748B">(SQL Server DB)</text>
          <line x1="1510" y1="150" x2="1510" y2="1110" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
        </g>
        

    <g id="phase-1-login">
      <rect x="50" y="170" width="1550" height="400" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="50" y="170" width="480" height="28" rx="8" fill="#1E3A8A" />
      <text x="65" y="189" font-family="Times New Roman, Arial" font-size="13" font-weight="bold" fill="#FFFFFF">GIAI ĐOẠN 1: ĐĂNG NHẬP &amp; CẤP PHÁT CẶP ACCESS / REFRESH TOKEN</text>
    </g>
    

    <g id="phase-2-inventory">
      <rect x="50" y="590" width="1550" height="500" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="50" y="590" width="480" height="28" rx="8" fill="#065F46" />
      <text x="65" y="609" font-family="Times New Roman, Arial" font-size="13" font-weight="bold" fill="#FFFFFF">GIAI ĐOẠN 2: QUẢN LÝ KHO THỰC PHẨM TỦ LẠNH VỚI BEARER JWT</text>
    </g>
    
<rect x="113" y="215" width="14" height="330" rx="2" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.5" />
<rect x="313" y="225" width="14" height="310" rx="2" fill="#E2E8F0" stroke="#2563EB" stroke-width="1.5" />
<rect x="533" y="245" width="14" height="270" rx="2" fill="#E2E8F0" stroke="#B45309" stroke-width="1.5" />
<rect x="753" y="260" width="14" height="240" rx="2" fill="#E2E8F0" stroke="#047857" stroke-width="1.5" />
<rect x="1503" y="280" width="14" height="50" rx="2" fill="#E2E8F0" stroke="#6B21A8" stroke-width="1.5" />
<rect x="1503" y="430" width="14" height="45" rx="2" fill="#E2E8F0" stroke="#6B21A8" stroke-width="1.5" />

        <g>
          <line x1="120" y1="225" x2="320" y2="225" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="220.0" y="219" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">1: Nhập email &amp; password, bấm &#x27;Đăng nhập&#x27;</text>
        </g>
        

        <g>
          <line x1="320" y1="245" x2="540" y2="245" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="430.0" y="239" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">2: POST /api/auth/login (LoginRequestDto)</text>
        </g>
        

        <g>
          <line x1="540" y1="260" x2="760" y2="260" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="650.0" y="254" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">3: LoginAsync(request)</text>
        </g>
        

        <g>
          <line x1="760" y1="280" x2="1510" y2="280" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1135.0" y="274" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">4: Users.FirstOrDefaultAsync(u =&gt; u.Email == email)</text>
        </g>
        

        <g>
          <line x1="1510" y1="315" x2="760" y2="315" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1135.0" y="309" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">5: return User (kèm PasswordHash)</text>
        </g>
        

    <g>
      <path d="M 767 340 L 820 340 L 820 365 L 767 365" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="828" y="357" font-family="Consolas, monospace" font-size="11" fill="#047857">6: BCrypt.Verify(password, hash)</text>
    </g>
    

    <g>
      <path d="M 767 385 L 830 385 L 830 410 L 767 410" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="838" y="402" font-family="Consolas, monospace" font-size="11" fill="#047857">7: GenerateJwtToken() &amp; GenerateRefreshToken()</text>
    </g>
    

        <g>
          <line x1="760" y1="435" x2="1510" y2="435" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1135.0" y="429" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">8: RefreshTokens.Add(TokenHash, ExpiresAt) &amp; SaveChangesAsync()</text>
        </g>
        

        <g>
          <line x1="1510" y1="470" x2="760" y2="470" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1135.0" y="464" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">9: DB Commit Success</text>
        </g>
        

        <g>
          <line x1="760" y1="495" x2="540" y2="495" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="650.0" y="489" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">10: return AuthResponseDto(AccessToken, RefreshToken)</text>
        </g>
        

        <g>
          <line x1="540" y1="520" x2="320" y2="520" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="430.0" y="514" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#059669">11: HTTP 200 OK (Tokens, UserId, FullName)</text>
        </g>
        

        <g>
          <line x1="320" y1="545" x2="120" y2="545" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="220.0" y="539" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">12: Hiển thị Dashboard &amp; lưu Token vào authStore</text>
        </g>
        
<rect x="113" y="640" width="14" height="420" rx="2" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.5" />
<rect x="313" y="650" width="14" height="400" rx="2" fill="#E2E8F0" stroke="#2563EB" stroke-width="1.5" />
<rect x="1003" y="670" width="14" height="350" rx="2" fill="#E2E8F0" stroke="#B45309" stroke-width="1.5" />
<rect x="1253" y="695" width="14" height="310" rx="2" fill="#E2E8F0" stroke="#047857" stroke-width="1.5" />
<rect x="1503" y="750" width="14" height="40" rx="2" fill="#E2E8F0" stroke="#6B21A8" stroke-width="1.5" />
<rect x="1503" y="830" width="14" height="40" rx="2" fill="#E2E8F0" stroke="#6B21A8" stroke-width="1.5" />
<rect x="1503" y="915" width="14" height="45" rx="2" fill="#E2E8F0" stroke="#6B21A8" stroke-width="1.5" />

        <g>
          <line x1="120" y1="650" x2="320" y2="650" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="220.0" y="644" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">13: Thêm 500g Ức gà (Hạn: 15/11) vào tủ lạnh</text>
        </g>
        

        <g>
          <line x1="320" y1="670" x2="1010" y2="670" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="665.0" y="664" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">14: POST /api/inventory [Bearer JWT] (CreateInventoryItemRequestDto)</text>
        </g>
        

    <g>
      <path d="M 1017 685 L 1080 685 L 1080 705 L 1017 705" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="1088" y="700" font-family="Consolas, monospace" font-size="11" fill="#B45309">15: Extract userId từ Claims (Sub)</text>
    </g>
    

        <g>
          <line x1="1010" y1="720" x2="1260" y2="720" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1135.0" y="714" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">16: AddItemAsync(userId, requestDto)</text>
        </g>
        

        <g>
          <line x1="1260" y1="750" x2="1510" y2="750" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1385.0" y="744" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">17: Foods.FindAsync(request.FoodId) [Validate thực phẩm]</text>
        </g>
        

        <g>
          <line x1="1510" y1="785" x2="1260" y2="785" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1385.0" y="779" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">18: return Food entity (Hợp lệ)</text>
        </g>
        

        <g>
          <line x1="1260" y1="830" x2="1510" y2="830" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1385.0" y="824" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">19: UserFoodInventories.FirstOrDefaultAsync(u, f, expiry) [Check trùng]</text>
        </g>
        

        <g>
          <line x1="1510" y1="865" x2="1260" y2="865" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1385.0" y="859" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">20: return null (Món mới chưa có trong kho)</text>
        </g>
        

        <g>
          <line x1="1260" y1="915" x2="1510" y2="915" stroke="#1E293B" stroke-width="1.5" marker-end="url(#arrow)" />
          <text x="1385.0" y="909" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">21: UserFoodInventories.Add(new Item) &amp; SaveChangesAsync()</text>
        </g>
        

        <g>
          <line x1="1510" y1="955" x2="1260" y2="955" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1385.0" y="949" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">22: Commit DB thành công (Tạo InventoryId mới)</text>
        </g>
        

        <g>
          <line x1="1260" y1="985" x2="1010" y2="985" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="1135.0" y="979" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">23: return InventoryItemResponseDto (AutoMapper)</text>
        </g>
        

        <g>
          <line x1="1010" y1="1015" x2="320" y2="1015" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="665.0" y="1009" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#059669">24: HTTP 201 CreatedAtAction (InventoryItemResponseDto)</text>
        </g>
        

        <g>
          <line x1="320" y1="1045" x2="120" y2="1045" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#open-arrow)" />
          <text x="220.0" y="1039" font-family="Consolas, 'Times New Roman', monospace" font-size="11.5" text-anchor="middle" fill="#1E293B">25: Cập nhật giao diện Tủ lạnh cá nhân &amp; hiển thị Badge hạn dùng</text>
        </g>
        
</svg>